<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: system-ui, sans-serif; background: #F7F9FC; color: #0F172A; font-size: 13px; padding: 14px; margin: 0; }
    h2 { font-size: 14px; font-weight: 700; color: #0B1E3D; margin: 0 0 12px; }
    .card-name-locked { background: #EFF6FF; border: 1px solid #BFDBFE; border-radius: 6px; padding: 8px 10px; font-size: 12px; color: #1B4FBB; font-weight: 600; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
    .card-name-locked svg { flex-shrink: 0; }
    .form-group { margin-bottom: 10px; }
    label { display: block; font-size: 10px; font-weight: 600; color: #64748B; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 3px; }
    input, select, textarea { width: 100%; padding: 7px 9px; border: 1px solid #E2E8F0; border-radius: 6px; font-size: 12px; color: #0F172A; background: #fff; box-sizing: border-box; }
    textarea { height: 44px; resize: none; }
    .hint { font-size: 10px; color: #94A3B8; margin-top: 2px; }
    .required { color: #E84040; }
    .btn-row { display: flex; gap: 8px; margin-top: 14px; }
    .btn { padding: 8px 14px; border-radius: 6px; border: none; cursor: pointer; font-size: 12px; font-weight: 600; flex: 1; }
    .btn-primary { background: #1B4FBB; color: #fff; }
    .btn-cancel { background: #F1F5F9; color: #64748B; }
    .error { background: #FEF2F2; border: 1px solid #FECACA; border-radius: 6px; padding: 8px; color: #991B1B; font-size: 11px; display: none; margin-top: 8px; }
    .success { background: #F0FDF4; border: 1px solid #86EFAC; border-radius: 6px; padding: 12px; text-align: center; color: #166534; font-size: 13px; display: none; }
    .loading { text-align: center; padding: 30px; color: #64748B; font-size: 12px; }
  </style>
</head>
<body>

<div id="loading" class="loading">Loading...</div>

<div id="main" style="display:none">
  <h2>⭐ Assign Task</h2>

  <div class="form-group">
    <label>Card</label>
    <div class="card-name-locked" id="card-name">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="#1B4FBB"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 14l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
      <span id="card-name-text"></span>
    </div>
  </div>

  <div class="form-group">
    <label>Additional details <span class="hint" style="text-transform:none;font-weight:400;">(optional)</span></label>
    <textarea id="task-details" placeholder="Add any extra detail for this task..."></textarea>
  </div>

  <div class="form-group">
    <label>Assign to <span class="required">*</span></label>
    <select id="assignee"><option value="">Select team member...</option></select>
  </div>

  <div class="form-group">
    <label>Due date <span class="required">*</span></label>
    <div style="position: relative;">
      <input type="date" id="due-date" style="cursor: pointer;"/>
      <svg id="date-icon" width="16" height="16" viewBox="0 0 24 24" fill="#64748B" style="position: absolute; right: 9px; top: 50%; transform: translateY(-50%); pointer-events: none;">
        <path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/>
      </svg>
    </div>
  </div>

  <div class="form-group">
    <label>Priority</label>
    <select id="priority">
      <option value="normal">Normal</option>
      <option value="urgent">🚨 Urgent</option>
    </select>
  </div>

  <div class="error" id="error-msg"></div>
  <div class="btn-row">
    <button class="btn btn-cancel" id="btn-cancel">Cancel</button>
    <button class="btn btn-primary" id="btn-submit">Assign Task</button>
  </div>
</div>

<div class="success" id="success-msg">
  ✓ Task assigned!<br/><small>It will appear in SpaceStars Task Monitor and on this card's checklist.</small>
</div>

<script src="https://p.trellocdn.com/power-up.min.js"></script>
<script>
  var GET_USERS_URL = 'https://project--8ea8cd27-693c-467c-8aa4-ec1a8c5d89bc.lovable.app/api/public/trello/active-users';
  var CREATE_TASK_URL = 'https://project--8ea8cd27-693c-467c-8aa4-ec1a8c5d89bc.lovable.app/api/public/trello/create-task';
  var SHARED_SECRET = '1a7c389b608d267d1dcab4978bdb7550c04788a2f91e1aaef0acf753ede92ef9';
  var t = TrelloPowerUp.iframe();
  var cardData = {};
  var currentMember = {};

  function todayISO() {
    var d = new Date();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + m + '-' + day;
  }

  window.onload = function () {
    var dueDateInput = document.getElementById('due-date');
    dueDateInput.min = todayISO();
    dueDateInput.value = todayISO();
    dueDateInput.addEventListener('click', function () {
      if (dueDateInput.showPicker) {
        try { dueDateInput.showPicker(); } catch (e) {}
      }
    });

    t.render(function () {
      return Promise.all([
        t.card('name', 'id', 'shortLink', 'url'),
        t.member('id', 'username')
      ])
        .then(function (results) {
          cardData = results[0];
          currentMember = results[1] || {};
          document.getElementById('card-name-text').textContent = cardData.name;
          return fetchUsers();
        })
        .catch(function () {
          document.getElementById('loading').textContent = 'Error loading card. Please try again.';
        });
    });

    document.getElementById('btn-cancel').onclick = function () { t.closePopup(); };
    document.getElementById('btn-submit').onclick = submitTask;
  };

  function fetchUsers() {
    return fetch(GET_USERS_URL, {
      headers: { 'X-Trello-Bridge-Secret': SHARED_SECRET }
    })
      .then(function (r) { return r.json(); })
      .then(function (users) {
        var sel = document.getElementById('assignee');
        (users || []).forEach(function (u) {
          var opt = document.createElement('option');
          opt.value = u.email;
          opt.textContent = u.name + (u.title ? ' — ' + u.title : '');
          sel.appendChild(opt);
        });
        document.getElementById('loading').style.display = 'none';
        document.getElementById('main').style.display = 'block';
        t.sizeTo('#main').catch(function () {});
      })
      .catch(function () {
        document.getElementById('loading').textContent = 'Error loading users.';
      });
  }

  function submitTask() {
    var details = document.getElementById('task-details').value.trim();
    var title = details ? (cardData.name + ' — ' + details) : cardData.name;

    var assigneeEmail = document.getElementById('assignee').value;
    var dueDate = document.getElementById('due-date').value;
    var priority = document.getElementById('priority').value;
    var err = document.getElementById('error-msg');
    err.style.display = 'none';

    if (!assigneeEmail) { err.textContent = 'Please select an assignee.'; err.style.display = 'block'; return; }
    if (!dueDate) { err.textContent = 'Please select a due date.'; err.style.display = 'block'; return; }
    if (dueDate < todayISO()) { err.textContent = 'Due date cannot be in the past.'; err.style.display = 'block'; return; }

    var btn = document.getElementById('btn-submit');
    btn.textContent = 'Saving...';
    btn.disabled = true;

    fetch(CREATE_TASK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Trello-Bridge-Secret': SHARED_SECRET },
      body: JSON.stringify({
        cardId: cardData.id,
        cardName: cardData.name,
        cardUrl: cardData.url,
        cardShortLink: cardData.shortLink,
        title: title,
        assigneeEmail: assigneeEmail,
        dueDate: dueDate,
        priority: priority,
        creatorTrelloMemberId: currentMember.id || null,
        creatorTrelloUsername: currentMember.username || null
      })
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.success) {
          document.getElementById('main').style.display = 'none';
          document.getElementById('success-msg').style.display = 'block';
          t.sizeTo('#success-msg').catch(function () {});
          setTimeout(function () { t.closePopup(); }, 2000);
        } else {
          throw new Error(data.error || 'Unknown error');
        }
      })
      .catch(function (e) {
        err.textContent = 'Error: ' + e.message;
        err.style.display = 'block';
        btn.textContent = 'Assign Task';
        btn.disabled = false;
      });
  }
</script>
</body>
</html>
